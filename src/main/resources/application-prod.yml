# Perfil de produção (SPRING_PROFILES_ACTIVE=prod). Valores sensíveis vêm só de variáveis de ambiente.
# O seed NÃO faz parte do perfil: só roda se for pedido explicitamente (SPRING_PROFILES_ACTIVE=prod,seed),
# por exemplo no primeiro deploy; depois remova "seed", pois ele recria o escritório de demonstração a cada início.
spring:
  datasource:
    # Supabase: use o session pooler (porta 5432) e SSL obrigatório. Usuário no formato postgres.<ref-do-projeto>.
    url: jdbc:postgresql://${DB_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB:postgres}?sslmode=${DB_SSLMODE:require}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    br.com.ativeplay: INFO

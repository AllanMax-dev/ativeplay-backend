name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Testes do backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixa o código
        uses: actions/checkout@v7

      - name: Instala o Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Os testes de integração sobem um PostgreSQL 16 com Testcontainers, usando o Docker do runner.
      # Os segredos de teste vêm de src/test/resources/application-test.yml; nada precisa ser configurado aqui.
      - name: Testes
        run: ./mvnw -B test
